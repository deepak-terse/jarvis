# Tool-choice benchmark: `jarvis bench` (first decision only) or `jarvis bench --live` (full turns).
# `expect` is the tool the model should call first: a name, a list of acceptable names, or omitted
# for "answer directly". `category` groups the per-category report.

# ── news ──
[[case]]
category = "news_search"
prompt = "What's the latest on the CJP protest in India?"
expect = "web_search"

[[case]]
category = "news_search"
prompt = "Tell me about the CJP protest."
expect = "web_search"

[[case]]
category = "news_search"
prompt = "Is there a farmers' protest in Delhi right now?"
expect = "web_search"

[[case]]
category = "news"
prompt = "What's the news today?"
expect = "news"

[[case]]
category = "news"
prompt = "Any tech news?"
expect = "news"

[[case]]
category = "news"
prompt = "Give me the latest business headlines."
expect = "news"

[[case]]
category = "news"
prompt = "What's happening in the world right now?"
expect = "news"

[[case]]
category = "news"
prompt = "Any sports news today?"
expect = "news"

[[case]]
category = "news"
prompt = "Why did the stock market fall yesterday?"
expect = ["web_search", "news"]

